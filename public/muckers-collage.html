<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Muckers Collage</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #fff; overflow: hidden; }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      padding: 12px;
      height: 100vh;
    }
    .grid img {
      width: 100%;
      height: 100%;
      min-height: 0;
      object-fit: contain;
      /* some sprites have transparent padding; zoom them so the visible logo fills the cell */
      transform: scale(var(--zoom, 1));
    }
  </style>
</head>
<body>
  <div class="grid">
    <img src="assets/sprites/muckers/mucker_luckers.png" alt="Mucker Luckers">
    <img src="assets/sprites/muckers/desperados.png" alt="Desperados" style="--zoom: 2.5">
    <img src="assets/sprites/muckers/moosicians.png" alt="Moosicians">
    <img src="assets/sprites/muckers/cobra_chickens.png" alt="Cobra Chickens">
    <img src="assets/sprites/muckers/barnstormers.png" alt="Barnstormers">
    <img src="assets/sprites/muckers/shameless.png" alt="Shameless" style="--zoom: 2.5">
    <img src="assets/sprites/muckers/mucku20.png" alt="Muck U">
    <img src="assets/sprites/muckers/Howlers.png" alt="Howlers">
    <img src="assets/sprites/muckers/final_straw.png" alt="Final Straw" style="--zoom: 1.45">
  </div>
</body>
</html>
